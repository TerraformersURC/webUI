<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" type="text/css" href="controls.css">

  <!-- roslib -->
  <script type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Three.js-->
         <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
  }
}
</script>
</head>

<body>
  <div class="header">
    <a href="./index.html" target="_blank" class="text" style="font-size: xx-large;">Home</a>
    <h1 class="text headerText">Terraformers Web UI</h1>
    <div class="battery">
      <div class="batteryBorder">
        <div class="batteryBox">
          <h3 class="batteryPercent">NAN%</h3>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="toggles">
      <h3 class="text">TOGGLES</h3>
      <div class="toggleGrid">
        <button onclick="setControl(0);">TOGGLE1</button>
        <button onclick="setControl(1);">TOGGLE2</button>
        <button onclick="setControl(2);">TOGGLE3</button>
        <button onclick="setControl(3);">TOGGLE4</button>
        <button onclick="setControl(4);">TOGGLE5</button>
        <button onclick="setControl(5);">TOGGLE6</button>
      </div>
    </div>

    <div class="drivetrain">
      <h3 class="text">DRIVETRAIN</h3>
      <div class="drivetrainGrid">
        <button>-</button>
        <button onclick="setControl(6);">FWD</button>
        <button>-</button>
        <button onclick="setControl(8);">LEFT</button>
        <button onclick="setControl(7);">REV</button>
        <button onclick="setControl(9);">RIGHT</button>
        <button>-</button>
        <button>-</button>
        <button>-</button>
      </div>
    </div>

    <div class="arm">
      <div class="armTitle">
        <h3 class="text">ARM &nbsp</h3>
        <h3 class="text" style="color:red;">X &nbsp</h3>
        <h3 class="text" style="color:lime;">Y &nbsp</h3>
        <h3 class="text" style="color:cyan;">Z</h3>
      </div>
      <div class="armGrid">

        <div class="armGridSub1">
          <button>-</button>
          <button style="background-color: lime;" onclick="setControl(10);">UP</button>
          <button>-</button>
          <button style="background-color: red;" onclick="setControl(12);">LEFT</button>
          <button onclick="setControl(16);">GRAB</button>
          <button style="background-color: red;" onclick="setControl(13);">RIGHT</button>
          <button>-</button>
          <button style="background-color: lime;" onclick="setControl(11);">DOWN</button>
          <button>-</button>

        </div>
        <div class="armGridSub2">
          <button style="background-color: cyan;" onclick="setControl(14);">FWD</button>
          <button style="background-color:cyan;" onclick="setControl(15);">REV</button>
        </div>
      </div>
    </div>
  </div>
  <div class="bottom">
    <div class="sim">
    </div>
    <div class="aruco">
      <h2 class="text" style="font-weight: 100;">Aruco Tag Information To Be Displayed Here</h2>
    </div>
  </div>
</body>

</html>
<!-- <script src="ros.js"></script> -->
     <script type="module" src="./sim.js"></script>

 <script src="general.js"></script>     
 <script src="./controlsRos.js"></script>
