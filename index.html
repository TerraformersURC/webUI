<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" type="text/css" href="index.css">
    <script type="text/javascript" src="roslib.js"></script>
    <link rel="stylesheet" href="leaflet.css">
    <script src="leaflet.js"></script>
</head>

<body>
  <div class="header">
        <a href="./controls.html" target="_blank" class="text" style="font-size: xx-large;">Controls</a>

    <h1 class="text headerText">Terraformers Web UI</h1>
    <div class="battery">
      <div class="batteryBorder">
        <div class="batteryBox">
          <h3 class="batteryPercent">NAN%</h3>
        </div>
      </div>
    </div>
  </div>
  <div class="topics">
    <p class="text">Active Topics:&nbsp </p>
    <p id="topicList" class="text"></p>
  </div>

  <div class="container">
    <div class="popup">
      <div class="innerPopup">

        <input class="waypointName"></input>
        <input type="color" class="waypointColor"></input>
      </div>
      <button id="nameBtn"> submit</button>
    </div>
    <div class="logs">
      <div class="btns">
        
      </div>
      <p id="topicDisplay" class="text">Selected Topic: N/A</p>
      <textarea id="log"  readonly class="logbox">
        
      </textarea>
    </div>
    <div class="container2" style="color:ghostwhite">
      <div id="map" style="height: 45vh; width: 50vw;"></div>
      <p id="map-zoom"></p>
      <img src="http://192.168.1.4:8080/stream?topic=/overlay/image" alt="Camera Feed: http://192.168.1.4:8080/stream?topic=/overlay/image" style="height:40vh; width:50vw;">
    </div>
  </div>
</body>

</html>
<script type="module" src="index.js"></script>
